# Publica servidor e site na Cloudflare a cada push na main.
# Precisa de: segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID,
# e das variáveis VITE_API_URL e VITE_WEB_URL (Settings > Secrets and variables > Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_API_URL != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Banco de dados (migrações)
        working-directory: apps/server
        run: npx wrangler d1 migrations apply checkoru --remote

      - name: Servidor (Worker)
        working-directory: apps/server
        run: npx wrangler deploy

      - name: Site (Pages)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
        run: |
          npm run build
          npx wrangler pages deploy apps/web/dist --project-name checkoru --branch main
